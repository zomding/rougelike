<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover：让画布铺到刘海屏边缘，safe-area 由 CSS env() 处理 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#05040a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>像素裂隙 · PIXEL RIFT</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>
  </div>

  <!-- 手机虚拟键位层：仅触摸设备显示，由 js/touch.js 驱动 -->
  <div id="touch-layer" aria-hidden="true">
    <button class="tbtn tbtn-play tbtn-move" id="btn-left" data-action="left" type="button"><span>◀</span></button>
    <button class="tbtn tbtn-play tbtn-move" id="btn-right" data-action="right" type="button"><span>▶</span></button>
    <button class="tbtn tbtn-play tbtn-atk" id="btn-attack" data-action="attack" type="button"><span>砍</span></button>
    <button class="tbtn tbtn-play" id="btn-jump" data-action="jump" type="button"><span>跳</span></button>
    <button class="tbtn tbtn-play" id="btn-dash" data-action="dash" type="button"><span>冲</span></button>
    <button class="tbtn tbtn-mini" id="btn-pause" data-action="pause" type="button"><span>Ⅱ</span></button>
    <button class="tbtn tbtn-mini" id="btn-full" data-full="1" type="button"><span>全</span></button>
  </div>

  <!-- 竖屏提示：手机上竖着拿时出现，转成横屏自动消失 -->
  <div id="rotate-hint" hidden>
    <div class="rh-box">
      <div class="rh-phone"><i></i></div>
      <div class="rh-title">请横屏游玩</div>
      <div class="rh-sub">本作是横版动作游戏<br />把手机横过来，视野和键位都会更舒服</div>
      <button id="rh-full" class="rh-btn" type="button">全屏 + 横屏</button>
      <button id="rh-skip" class="rh-btn rh-btn-ghost" type="button">继续竖屏玩</button>
    </div>
  </div>

  <!-- 全部为普通脚本，按顺序加载；不使用 module / import / fetch -->
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/item.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/room.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
